version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: deepguard_postgres
    restart: always
    environment:
      POSTGRES_DB: deepguard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpass}
    container_name: deepguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/deepguard_db
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/deepguard_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-long-random-secret-key-in-production
      JWT_SECRET: CHANGE_ME_SECRET
      APP_ENV: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard_celery
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/deepguard_db
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/deepguard_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: localhost:8000/api/v1/ws
    container_name: deepguard_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
