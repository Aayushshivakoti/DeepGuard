<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      color: #38bdf8;
    }
    .input-box {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .result-card {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .authentic { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .phishing { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">DeepGuard Gateway</div>
  </div>

  <input type="text" id="urlInput" class="input-box" placeholder="Paste URL or domain to scan..." />
  <button id="scanBtn" class="btn">Verify Authenticity</button>

  <div id="resultCard" class="result-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="verdictLabel" class="badge authentic">AUTHENTIC</span>
      <span id="scoreLabel" style="font-size: 11px; font-weight: bold; color: #94a3b8;">Confidence: 94%</span>
    </div>
    <p id="headlineText" style="font-size: 11px; margin-top: 8px; color: #cbd5e1;"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
