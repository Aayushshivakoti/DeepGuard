apiVersion: v1
kind: Secret
metadata:
  name: deepguard-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres-service:5432/deepguard_db"
  SYNC_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres-service:5432/deepguard_db"
  REDIS_URL: "redis://redis-service:6379/0"
  SECRET_KEY: "change-this-to-a-very-long-and-secure-random-secret-key-in-production"
  JWT_SECRET: "change-this-to-a-very-long-and-secure-jwt-signing-secret-in-production"
